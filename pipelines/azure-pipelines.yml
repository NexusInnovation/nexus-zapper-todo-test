trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

parameters:
  - name: infrastructureDirectory
    type: string
    default: "$(Build.SourcesDirectory)/infra"

  - name: infrastructureFilters
    type: object
    default:
      - "infra/"
      - "pipelines/templates/infra/"

  - name: pipelineFilters
    type: object
    default:
      - "infra/"
      - "pipelines/"

  - name: location
    type: string
    default: "canadaeast"

  - name: scriptsDirectory
    type: string
    default: "pipelines/scripts"

  - name: forceInfra
    type: boolean
    default: false

  - name: environments
    type: object
    default:
      - name: "Dev"
        environmentCode: "dev"
        resourceGroupName: "zapper-todo-dev-rg"
        serviceConnection: "sc-nexus-zapper-todo-dev"
        hasDeploymentSlots: false

      - name: "Uat"
        environmentCode: "uat"
        resourceGroupName: "zapper-todo-uat-rg"
        serviceConnection: "sc-nexus-zapper-todo-uat"
        hasDeploymentSlots: false

      - name: "Prod"
        environmentCode: "prod"
        resourceGroupName: "zapper-todo-prod-rg"
        serviceConnection: "sc-nexus-zapper-todo-prod"
        hasDeploymentSlots: false

  - name: applications
    type: object
    default:
      - name: "nexus-zapper-todo"
        forceBuildAndDeploy: false
        components:
          - name: "backend"
            buildTemplate: "../backend/build-stage.yml"
            deployTemplate: "../backend/deploy-stage.yml"
            config:
              dotnetVersion: "10.0.x"
              solution: "src/backend/Nexus.ZapperTodo.slnx"
              publishProject: "src/backend/Nexus.ZapperTodo.Api/Nexus.ZapperTodo.Api.csproj"
              directoryPath: "$(Build.SourcesDirectory)/src/backend"
              runTests: true
              testPath: "$(Build.SourcesDirectory)/src/backend/tests"
              packageName: "Backend"
              resourceNameOverride: "zapper-todo-{environmentCode}-app-api"
            componentFilters:
              - "src/backend/"

          - name: "frontend"
            # Project-owned pnpm variant of ../frontend/build-stage.yml (which uses npm ci).
            buildTemplate: "../custom/frontend-build-stage-pnpm.yml"
            deployTemplate: "../frontend/deploy-stage.yml"
            config:
              directoryPath: "$(Build.SourcesDirectory)/src/frontend"
              pnpmVersion: "12.8.1"
              runTests: true
              testScript: "test:run"
              packageName: "Frontend"
              resourceNameOverride: "zapper-todo-{environmentCode}-app-web"
            componentFilters:
              - "src/frontend/"

        applicationFilters:
          - "src/"

stages:
  - template: ./templates/common/pipeline.yml
    parameters:
      applications: ${{ parameters.applications }}
      environments: ${{ parameters.environments }}
      infrastructureDirectory: ${{ parameters.infrastructureDirectory }}
      infrastructureFilters: ${{ parameters.infrastructureFilters }}
      pipelineFilters: ${{ parameters.pipelineFilters }}
      location: ${{ parameters.location }}
      scriptsDirectory: ${{ parameters.scriptsDirectory }}
      forceInfra: ${{ parameters.forceInfra }}
