# Project-specific variant of templates/frontend/build-stage.yml for pnpm projects.
# Upstream templates stay verbatim; this file is owned by the project.
parameters:
  - name: component
    type: object
    default: {}

  - name: applicationName
    type: string

  - name: scriptsDirectory
    type: string

steps:
  - task: PowerShell@2
    displayName: "Resolve Node.js version"
    inputs:
      targetType: filePath
      filePath: ${{ parameters.scriptsDirectory }}/Resolve-NodeVersion.ps1
      arguments: >-
        -DirectoryPath '${{ parameters.component.config.directoryPath }}'
        -NodeVersion '${{ parameters.component.config.nodeVersion }}'
      pwsh: true

  - task: UseNode@1
    displayName: "Install Node.js"
    inputs:
      version: "$(resolvedNodeVersion)"

  - script: |
      if git ls-files | grep -E '(^|/)(package-lock\.json|npm-shrinkwrap\.json)$'; then
        echo "##vso[task.logissue type=error]npm lockfiles are not allowed. This project uses pnpm."
        exit 1
      fi
    displayName: "Reject npm lockfiles"
    workingDirectory: $(Build.SourcesDirectory)

  - script: |
      corepack enable
      corepack prepare pnpm@${{ coalesce(parameters.component.config.pnpmVersion, 'latest') }} --activate
      pnpm --version
      echo "##vso[task.setvariable variable=PNPM_STORE]$(pnpm store path)"
    displayName: "Enable pnpm"
    workingDirectory: ${{ parameters.component.config.directoryPath }}/

  - task: Cache@2
    displayName: "Cache pnpm store"
    inputs:
      key: 'pnpm | "$(Agent.OS)" | "$(resolvedNodeVersion)" | ${{ parameters.component.config.directoryPath }}/pnpm-lock.yaml'
      path: $(PNPM_STORE)

  - ${{ if ne(coalesce(parameters.component.config.npmrcPath, ''), '') }}:
      - task: npmAuthenticate@0
        displayName: "Authenticate registry"
        inputs:
          workingFile: "${{ parameters.component.config.npmrcPath }}"

  - script: pnpm install --frozen-lockfile
    displayName: "Install the dependencies"
    workingDirectory: ${{ parameters.component.config.directoryPath }}/

  - script: pnpm run lint
    displayName: "Lint"
    workingDirectory: ${{ parameters.component.config.directoryPath }}/

  - ${{ if eq(parameters.component.config.runTests, true) }}:
      - script: pnpm run ${{ coalesce(parameters.component.config.testScript, 'test') }}
        displayName: "Unit Tests"
        workingDirectory: ${{ parameters.component.config.directoryPath }}/

  - script: pnpm run build
    displayName: "Build"
    workingDirectory: ${{ parameters.component.config.directoryPath }}/

  - ${{ if ne(variables['Build.Reason'], 'PullRequest') }}:
      - task: CopyFiles@2
        displayName: "Copy Frontend Files to Artifacts Directory"
        inputs:
          SourceFolder: ${{ parameters.component.config.directoryPath }}/dist/
          Contents: "**/*"
          TargetFolder: "$(Build.ArtifactStagingDirectory)/${{ parameters.component.config.packageName }}"

      - publish: $(Build.ArtifactStagingDirectory)
        artifact: "${{ parameters.applicationName }}-${{ parameters.component.name }}"
        displayName: "Publish Artifacts"
